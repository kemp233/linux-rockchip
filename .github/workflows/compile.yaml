name: Build rk3566-lb2004 kernel

on:
  workflow_dispatch:
  push:
    branches: [rk-6.1-rkr6.1]
  pull_request:
    types: [opened, synchronize]

jobs:
  Build:
    name: Compile and upload kernel
    runs-on: ubuntu-24.04-arm
    if: ${{ github.repository_owner == 'armbian' || github.repository_owner == 'kemp233' }}
    env:
      OCI_TARGET_BASE: "ghcr.io/${{ github.repository }}/"
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc

      - name: Compile kernel + dtbs + modules
        run: |
          echo "=== Configure .config (rockchip BSP defconfig) ==="
          cp arch/arm64/configs/rockchip_linux_defconfig .config 2>/dev/null || \
          cp arch/arm64/configs/rockchip_defconfig .config 2>/dev/null || \
          make ARCH=arm64 defconfig
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/' .config
          cat >> .config << KEOF
          CONFIG_DTC_SYMBOLS=y
          CONFIG_LOCALVERSION="-rk3566-bsp"
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_CROSS_MEMORY_ATTACH=y
          KEOF
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -5

          echo "=== Inject rk3566-lb2000 DTS ==="
          curl -fsSL https://raw.githubusercontent.com/kemp233/amlogic-s9xxx-armbian/main/compile-kernel/tools/patch/linux-6.1.y-rockchip-main/rk3566-lb2004.dts \
            -o arch/arm64/boot/dts/rockchip/rk3566-lb2004.dts
          grep -q 'rk3566-lb2004' arch/arm64/boot/dts/rockchip/Makefile || \
            sed -i '/rk3566-pinenote.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-lb2004.dtb' arch/arm64/boot/dts/rockchip/Makefile

          echo "=== Build Image (all cores) ==="
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tail -5
          ls -lh arch/arm64/boot/Image && echo "OK: Image built"

          echo "=== Build dtbs ==="
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs 2>&1 | tail -5
          echo "--- lb2004 dtb ---"
          ls -lh arch/arm64/boot/dts/rockchip/rk3566-lb2004.dtb 2>/dev/null || {
            echo "Warning: lb2004 dtb failed via make, fallback to dtc"
            cpp -P -x assembler-with-cpp -undef -D__DTS__ -I include \
              arch/arm64/boot/dts/rockchip/rk3566-lb2004.dts \
              /tmp/rk3566-lb2004.dts.pre.tmp 2>/dev/null
            dtc -I dts -O dtb -f -o arch/arm64/boot/dts/rockchip/rk3566-lb2004.dtb \
              /tmp/rk3566-lb2004.dts.pre.tmp 2>&1 || true
            ls -lh arch/arm64/boot/dts/rockchip/rk3566-lb2004.dtb 2>/dev/null || echo "FAIL: dtc fallback also failed"
          }

          echo "=== Build kernel modules ==="
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tail -5
          echo "Module count: $(find . -name '*.ko' | wc -l)"

          echo "=== Package modules into tarball ==="
          tar czf /tmp/rk3566-modules.tar.gz $(find . -name '*.ko' -printf '%P ') 2>/dev/null
          ls -lh /tmp/rk3566-modules.tar.gz

      - name: Upload artifacts (Image + dtb)
        uses: actions/upload-artifact@v6
        with:
          name: rk3566-kernel-bsp
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/rockchip/rk3566-lb2004.dtb
          retention-days: 30

      - name: Upload modules
        uses: actions/upload-artifact@v6
        with:
          name: rk3566-modules
          path: /tmp/rk3566-modules.tar.gz
          retention-days: 30

      - name: Release
        if: github.event_name != 'pull_request'
        run: |
          KVER=$(make -s ARCH=arm64 kernelrelease 2>/dev/null || \
            awk '/^VERSION/{v=$3} /^PATCHLEVEL/{p=$3} /^SUBLEVEL/{s=$3} END{print v"."p"."s}' Makefile)
          TAG="rk3566-bsp-${KVER}"
          echo "Kernel version: ${KVER} -> tag: ${TAG}"
          gh release create "${TAG}" \
            --repo kemp233/linux-rockchip \
            --title "rk3566 BSP kernel ${KVER}" \
            --notes "rk3566-lb2004.dtb + Image + modules | Linux ${KVER} | Commit: ${{ github.sha }}" \
            arch/arm64/boot/Image \
            arch/arm64/boot/dts/rockchip/rk3566-lb2004.dtb \
            /tmp/rk3566-modules.tar.gz
          echo "Release created: https://github.com/kemp233/linux-rockchip/releases/tag/${TAG}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}