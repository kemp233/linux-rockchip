name: Build rk3566-lb2004 dtb

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]

jobs:
  Build:
    name: Compile and upload kernel
    runs-on: ubuntu-24.04-arm
    if: ${{ github.repository_owner == 'armbian' || github.repository_owner == 'kemp233' }}
    env:
      OCI_TARGET_BASE: "ghcr.io/${{ github.repository }}/"
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc

      - name: Compile rk3566-lb2004 dtb
        run: |
          echo "=== 配置 .config ==="
          cp arch/arm64/configs/rockchip_defconfig .config 2>/dev/null || make ARCH=arm64 defconfig
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/' .config
          cat >> .config << EOF
          CONFIG_DTC_SYMBOLS=y
          CONFIG_LOCALVERSION_AUTO=n
          CONFIG_CROSS_MEMORY_ATTACH=y
          CONFIG_CPU_ISOLATION=y
          EOF
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3
          
          echo "=== 注入 lb2004 DTS ==="
          curl -fsSL https://raw.githubusercontent.com/kemp233/amlogic-s9xxx-armbian/main/compile-kernel/tools/patch/linux-6.1.y-rockchip-main/rk3566-lb2004.dts \
            -o arch/arm64/boot/dts/rockchip/rk3566-lb2004.dts
          grep -q 'rk3566-lb2004' arch/arm64/boot/dts/rockchip/Makefile || \
            sed -i '/rk3566-pinenote.dtb/a dtb-$(CONFIG_ARCH_ROCKCHIP) += rk3566-lb2004.dtb' arch/arm64/boot/dts/rockchip/Makefile
          
          echo "=== 编译 dtb (跳过 duplicate_label 错误) ==="
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs DTC_FLAGS="-Wno-duplicate_label" 2>&1 | tail -15
          
          echo "=== 产物 ==="
          ls -lh arch/arm64/boot/dts/rockchip/rk3566-lb2004.dtb 2>/dev/null && echo "✅ 成功" || echo "❌ 失败"

      - name: Upload dtb artifact
        uses: actions/upload-artifact@v4
        with:
          name: rk3566-lb2004-dtb
          path: arch/arm64/boot/dts/rockchip/rk3566-lb2004.dtb
          retention-days: 30