name: Build Z96A rk3568 kernel with vendor RKVDEC2

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [rk-6.1-rkr5.1]
    paths:
      - 'drivers/staging/media/rkvdec/**'
      - '.github/workflows/compile-z96a-rkvdec.yaml'

jobs:
  Build:
    name: Compile Z96A kernel (vendor RKVDEC2)
    runs-on: ubuntu-24.04-arm
    if: ${{ github.repository_owner == 'kemp233' }}
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison bc

      - name: Add SC8886S charger driver (builtin, real battery SOC)
        run: |
          curl -fsSL https://raw.githubusercontent.com/kemp233/sc8886s-driver/main/sc8886s_charger.c \
            -o drivers/power/supply/sc8886s_charger.c
          grep -q CHARGER_SC8886S drivers/power/supply/Kconfig || printf '%s\n' \
            '' \
            'config CHARGER_SC8886S' \
            '  tristate "SouthChip SC8886S battery charger"' \
            '  depends on I2C' \
            '  help' \
            '  SouthChip SC8886S charger on Z96A (i2c0 0x6b). Provides real' \
            '  battery voltage/current/SOC from the charger own ADC.' >> drivers/power/supply/Kconfig
          grep -q sc8886s_charger drivers/power/supply/Makefile || \
            echo 'obj-$(CONFIG_CHARGER_SC8886S) += sc8886s_charger.o' >> drivers/power/supply/Makefile
          ls -la drivers/power/supply/sc8886s_charger.c

      - name: Configure .config (rockchip BSP + rkvdec fragment)
        run: |
          cp arch/arm64/configs/rockchip_linux_defconfig .config
          sed -i 's/CONFIG_WERROR=y/CONFIG_WERROR=n/' .config
          printf '%s\n' \
            'CONFIG_LOCALVERSION="-legacy-rockchip-rk3568-z96a"' \
            'CONFIG_LOCALVERSION_AUTO=n' \
            '# V4L2 staging rkvdec - big core for Chromium V4L2VDA (HEVC/H264/VP9)' \
            'CONFIG_STAGING_MEDIA=y' \
            'CONFIG_VIDEO_ROCKCHIP_VDEC=m' \
            '# CONFIG_ROCKCHIP_MPP_RKVDEC2 is not set' \
            'CONFIG_DMABUF_HEAPS_ROCKCHIP=y' \
            'CONFIG_DMABUF_HEAPS_ROCKCHIP_CMA_HEAP=y' \
            '# USB NIC (RTL8153 ECM) - board network lifeline, do not drop' \
            'CONFIG_USB_USBNET=y' \
            'CONFIG_USB_RTL8153_ECM=y' \
            '# SC8886S charger builtin - real battery SOC, no out-of-tree module' \
            'CONFIG_CHARGER_SC8886S=y' \
            '# GPU: Panfrost (Mesa) must own Mali-G52; kbase blob conflicts with it' \
            'CONFIG_DRM_PANFROST=y' \
            '# CONFIG_MALI_MIDGARD is not set' >> .config
          cat .config | tail -8
          yes "" | make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig 2>&1 | tail -3 || true
          echo "=== verify config (hard gate: staging rkvdec module must be enabled) ==="
          grep -qE "^CONFIG_VIDEO_ROCKCHIP_VDEC=m$" .config || {
            echo "FAIL: CONFIG_VIDEO_ROCKCHIP_VDEC is not =m after olddefconfig"
            grep -E "CONFIG_VIDEO_ROCKCHIP_VDEC|CONFIG_ROCKCHIP_MPP_RKVDEC2|CONFIG_USB_USBNET" .config
            exit 1
          }
          grep -E "CONFIG_VIDEO_ROCKCHIP_VDEC|CONFIG_USB_USBNET|CONFIG_DMABUF_HEAPS_ROCKCHIP|CONFIG_CHARGER_SC8886S|CONFIG_DRM_PANFROST" .config || true

      - name: Build Image
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image 2>&1 | tee /tmp/b1.log | tail -4
          { grep -iE "error:|cannot find|No such file" /tmp/b1.log | head -20; } || true
          ls -lh arch/arm64/boot/Image

      - name: Build dtbs (with dtc -f fallback)
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- dtbs 2>&1 | tee /tmp/b1.log | tail -4 || true
          echo "--- z96a dtb (decompiled DTS has property-after-subnode; dtc -f if make failed) ---"
          ls -lh arch/arm64/boot/dts/rockchip/rk3568-z96a-laptop-v2.dtb 2>/dev/null || {
            echo "Warning: dtb failed via make, fallback to dtc -f"
            cpp -P -x assembler-with-cpp -undef -D__DTS__ -I include \
              arch/arm64/boot/dts/rockchip/rk3568-z96a-laptop-v2.dts \
              /tmp/z96a.pre.tmp 2>/dev/null
            dtc -I dts -O dtb -f -o arch/arm64/boot/dts/rockchip/rk3568-z96a-laptop-v2.dtb \
              /tmp/z96a.pre.tmp 2>&1 | tail -5 || true
            ls -lh arch/arm64/boot/dts/rockchip/rk3568-z96a-laptop-v2.dtb || echo "FAIL: dtc fallback also failed"
          }

      - name: Build modules
        run: |
          make -j$(nproc) ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- modules 2>&1 | tee /tmp/b2.log | tail -4
          { grep -iE "error:" /tmp/b2.log | head -20; } || true
          echo "Module count: $(find . -name '*.ko' | wc -l)"
          tar czf /tmp/z96a-modules.tar.gz $(find . -name '*.ko' -printf '%P ') 2>/dev/null
          ls -lh /tmp/z96a-modules.tar.gz

      - name: Upload artifacts (Image + dtb)
        uses: actions/upload-artifact@v6
        with:
          name: z96a-kernel-rkvdec
          path: |
            arch/arm64/boot/Image
            arch/arm64/boot/dts/rockchip/rk3568-z96a-laptop-v2.dtb
          retention-days: 30

      - name: Upload all modules
        uses: actions/upload-artifact@v6
        with:
          name: z96a-modules
          path: /tmp/z96a-modules.tar.gz
          retention-days: 30

      - name: Release
        if: github.event_name != 'pull_request'
        # cross-repo workflow_call carries the CALLER's GITHUB_TOKEN which
        # cannot create releases here -> keep non-fatal, artifacts remain
        continue-on-error: true
        run: |
          KVER=$(make -s ARCH=arm64 kernelrelease 2>/dev/null || \
            awk '/^VERSION/{v=$3} /^PATCHLEVEL/{p=$3} /^SUBLEVEL/{s=$3} END{print v"."p"."s}' Makefile)
          TAG="z96a-rkvdec-${KVER}"
          echo "Kernel version: ${KVER} -> tag: ${TAG}"
          # create-or-update: existing tag must NOT fail the build
          gh release create "${TAG}" \
            --repo kemp233/linux-rockchip \
            --title "Z96A kernel ${KVER} + vendor RKVDEC2" \
            --notes "vendor mpp rkvdec2 (main 4K60 decode core, V4L2 M2M staging removed) | Linux ${KVER} | Commit: ${{ github.sha }}" \
            arch/arm64/boot/Image \
            arch/arm64/boot/dts/rockchip/rk3568-z96a-laptop-v2.dtb \
            /tmp/z96a-modules.tar.gz \
          || gh release upload "${TAG}" \
            --repo kemp233/linux-rockchip \
            --clobber \
            arch/arm64/boot/Image \
            arch/arm64/boot/dts/rockchip/rk3568-z96a-laptop-v2.dtb \
            /tmp/z96a-modules.tar.gz
          echo "Release: https://github.com/kemp233/linux-rockchip/releases/tag/${TAG}"
          echo "Release: https://github.com/kemp233/linux-rockchip/releases/tag/${TAG}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
